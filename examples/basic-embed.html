<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Axo Chat — Basic Embed Example</title>
<style>body { font-family: system-ui, sans-serif; max-width: 640px; margin: 60px auto; padding: 0 20px; line-height: 1.6; }</style>
</head>
<body>
<h1>My Bakery 🍞</h1>
<p>Welcome to our website! The chat button at the bottom-right is Axo Chat — try asking it about our prices or opening hours.</p>

<!-- Minimal Axo Chat embed: no config file needed, defaults apply. -->
<!-- Add data-attributes to customise without touching any JS. -->
<script src="../dist/axo-chat.js"
  data-bot-name="BakeryBot"
  data-accent-color="#d97706"
  data-theme="light"></script>
</body>
</html>
