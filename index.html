<!doctype html>
<html lang="en" data-theme="black">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
<meta name="color-scheme" content="light dark" />
<link rel="icon" href="data:," />
<title>Axo Chat Main</title>
<style>
:root{
  --accent:#ffffff; --accent-ink:#0b0b0c;
  --bg:#000000; --surface:#1c1c1e; --surface2:#2c2c2e; --text:#ffffff; --text2:#e5e5ea;
  --muted:#98989d; --border:rgba(255,255,255,.08); --border2:rgba(255,255,255,.14);
  --input:rgba(255,255,255,.06); --hover:rgba(255,255,255,.07); --rowbg:rgba(255,255,255,.055);
  --overlay:rgba(0,0,0,.55); --glass:rgba(28,28,30,.72); --glass2:rgba(44,44,46,.78);
  --danger:#ff453a; --kb:0px; --kbFixed:0px; --sidebar-w:min(312px,calc(100vw - 66px));
  --peek:#161618; --peek-desk:#141416; --pill:#232326;
  --ease:cubic-bezier(.32,.72,0,1);
  --sb-ease:cubic-bezier(.32,.72,0,1); --sb-ms:340ms;
}
html[data-theme="white"]{
  --bg:#ffffff; --surface:#f2f2f7; --surface2:#e5e5ea; --text:#111111; --text2:#333333;
  --muted:#6b6b70; --border:rgba(0,0,0,.09); --border2:rgba(0,0,0,.16);
  --input:rgba(0,0,0,.045); --hover:rgba(0,0,0,.05); --rowbg:rgba(0,0,0,.04);
  --overlay:rgba(0,0,0,.35); --glass:rgba(255,255,255,.78); --glass2:rgba(242,242,247,.85);
  --peek:#f2f2f7; --peek-desk:#f5f5f7; --pill:#e9e9ee;
}
@media (min-width:820px){ :root{ --sidebar-w:284px; } }
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{height:100%; overscroll-behavior:none;}
body{margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif; font-size:16px; overflow:hidden;}
button{font:inherit; color:inherit; background:none; border:none; cursor:pointer; padding:0;}
input,textarea,select{font:inherit; color:inherit;}
svg{display:block;}
.ic{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;}
.ic.sm{width:16px;height:16px;} .ic.lg{width:22px;height:22px;}

/* ---------- App frame ---------- */
#app{position:fixed; inset:0; overflow:hidden; background:var(--bg);}
/* Sidebar sits UNDER the stage; the stage slides over it on close.
   §35 curved side-chat UI (original code, kept exactly): when the side
   menu is open the chat stage pushes right and curves into a card —
   mobile: translateX(sidebar) scale(.965), 34px radius, #161618 peek;
   desktop: 30px radius card with an 8px margin. Never flattened. */
#sidebar{position:absolute; top:0; left:0; bottom:0; width:var(--sidebar-w); background:var(--bg); z-index:1; display:flex; flex-direction:column; transform:translate3d(-102%,0,0); will-change:transform; backface-visibility:hidden; -webkit-backface-visibility:hidden;}
#sidebar.noanim{transition:none !important;}
#stage{position:absolute; inset:0; background:var(--bg); z-index:2; display:flex; flex-direction:column; will-change:transform; backface-visibility:hidden; -webkit-backface-visibility:hidden; transform-origin:left center; overflow:hidden; box-shadow:-18px 0 44px rgba(0,0,0,.35);}
#stage.noanim{transition:none !important;}
#app.dragging #sidebar,#app.dragging #stage{transition:none !important; will-change:transform;}
#app.dragging #stage{box-shadow:-16px 0 48px rgba(0,0,0,.6);}
#scrim{position:absolute; inset:0; background:transparent; opacity:0; pointer-events:none; z-index:3;}
@media (min-width:820px){
  #sidebar{transform:translateX(0);}
  #stage{transform:translateX(var(--sidebar-w)); width:calc(100% - var(--sidebar-w) - 8px); margin:8px 8px 8px 0; height:calc(100% - 16px); border-radius:30px; background:var(--peek-desk); border:1px solid var(--border); box-shadow:-12px 0 40px rgba(0,0,0,.55);}
  #app.sb-closed #sidebar{transform:translateX(-102%);}
  #app.sb-closed #stage{transform:translateX(0); width:100%; margin:0; height:100%; border-radius:0; background:var(--bg); border:none; box-shadow:none;}
  #app.anim #sidebar{transition:transform var(--sb-ms) var(--sb-ease);}
  #app.anim #stage{transition:transform var(--sb-ms) var(--sb-ease), width var(--sb-ms) var(--sb-ease), margin var(--sb-ms) var(--sb-ease), height var(--sb-ms) var(--sb-ease), border-radius var(--sb-ms) var(--sb-ease), background-color .24s ease, box-shadow var(--sb-ms) ease;}
  #scrim{display:none;}
}
@media (max-width:819px){
  /* Mobile: ONLY transform + border-radius animate — the two properties
     the compositor can run without repainting the whole stage every
     frame. Background and shadow are set once by the sb-open class,
     never transitioned, so the slide holds a steady 60fps flow. */
  #app.anim #sidebar{transition:transform var(--sb-ms) var(--sb-ease);}
  #app.anim #stage{transition:transform var(--sb-ms) var(--sb-ease), border-radius var(--sb-ms) var(--sb-ease);}
  /* Curved peeking card: the stage keeps its inline translate/scale
     (set in JS) and gains the original 34px curve here. */
  #app.sb-open #stage{border-radius:34px; background:var(--peek); border:1px solid var(--border2); box-shadow:-16px 0 48px rgba(0,0,0,.75);}
  #app.sb-open #scrim{pointer-events:auto;}
}

/* ---------- Sidebar (screenshot / original code, kept exactly) ----------
   Clean black menu: app-name header, TABS (Main chat, Library) with the
   reorder note, SIDE CHATS with archive icon and pill chat rows, and the
   bottom bar — dark gear circle, wide Search pill, dark compose circle,
   all 46px on #232326 as in the original bottom search bar. */
.sb-scroll{flex:1; min-height:0; overflow-y:auto; overflow-x:hidden; overscroll-behavior:contain; overscroll-behavior-y:contain; -webkit-overflow-scrolling:touch; touch-action:pan-y; display:flex; flex-direction:column; padding-top:calc(14px + env(safe-area-inset-top)); padding-bottom:12px;}
.sb-head{display:flex; align-items:center; gap:8px; padding:4px 20px 16px;}
.sb-title{font-size:25px; font-weight:700; letter-spacing:-.025em; line-height:1.15; flex:1;}
.sb-logo{height:40px; width:auto; max-width:196px; object-fit:contain; object-position:left center; display:block; flex:1; min-width:0;}
.sb-icon-btn{width:38px;height:38px;border-radius:50%;background:var(--pill);border:1px solid var(--border);display:grid;place-items:center;color:var(--text);flex:none;}
.sb-icon-btn:active{background:var(--hover);}
.sb-sec-label{font-size:11.5px; font-weight:700; letter-spacing:.08em; color:var(--muted); text-transform:uppercase; padding:0 20px;}
.sb-note{font-size:13px; color:var(--muted); padding:3px 20px 10px;}
.sb-tabs{position:relative; display:flex; flex-direction:column; padding:0 14px 4px 18px; gap:2px;}
.sb-tab{position:relative; display:flex; align-items:center; gap:14px; width:100%; padding:9px 10px 9px 12px; border-radius:10px; color:var(--text2); font-size:16px; font-weight:500; text-align:left;}
.sb-tab.sel{color:var(--text); font-weight:600;}
.sb-tab.sel::before{content:""; position:absolute; left:-6px; top:5px; bottom:5px; width:3.5px; border-radius:999px; background:var(--text);}
.sb-tab .tic{width:22px; height:22px; display:grid; place-items:center; color:var(--muted); flex:none;}
.sb-tab.sel .tic{color:var(--text);}
.sb-tab span{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.sb-divider{height:1px; background:var(--border); margin:12px 20px; flex:none;}
.sb-sec-head{display:flex; align-items:center; justify-content:space-between; padding:0 20px 8px;}
.sb-archive-btn{background:none; border-radius:8px; padding:4px 6px; color:var(--muted); display:inline-flex; align-items:center; gap:4px;}
.sb-archive-btn.on{background:color-mix(in srgb, var(--accent) 18%, transparent); color:var(--accent);}
.sb-list{padding:2px 12px 16px; display:flex; flex-direction:column; gap:4px;}
.sb-empty{padding:10px 16px; color:var(--muted); font-size:14px;}
.chat-row{position:relative; border-radius:999px; overflow:hidden;}
.chat-row-under{position:absolute; inset:0; display:flex; align-items:center; justify-content:flex-end; padding:0 18px; font-size:12px; font-weight:600; color:#fff; border-radius:999px; opacity:0;}
.chat-row-under .u-open{color:#fff; display:none; align-items:center; gap:6px;}
.chat-row-under .u-del{color:#fff; display:none; align-items:center; gap:6px;}
.chat-row-main{position:relative; z-index:1; display:flex; align-items:center; gap:8px; width:100%; text-align:left; padding:11px 18px; border-radius:999px; font-size:15.5px; font-weight:400; color:var(--text2); will-change:transform; background:transparent; touch-action:pan-y;}
.chat-row.sel .chat-row-main{background:var(--pill); color:var(--text); font-weight:500;}
.chat-row.splitp .chat-row-main{background:color-mix(in srgb, var(--accent) 14%, transparent); outline:1px solid color-mix(in srgb, var(--accent) 32%, transparent); outline-offset:-1px; color:var(--text);}
.chat-row-title{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.row-dot{width:8px; height:8px; border-radius:50%; background:var(--accent); flex:none;}
.split-badge{font-size:10px; font-weight:700; color:var(--accent); border:1px solid color-mix(in srgb, var(--accent) 45%, transparent); padding:2px 6px; border-radius:999px; text-transform:uppercase; letter-spacing:.04em;}
.row-menu-btn{width:auto;height:auto;border-radius:0;display:grid;place-items:center;color:var(--muted);opacity:.55;flex:none;padding:2px 2px;}
.chat-row.sel .row-menu-btn{opacity:.95;}
/* Bottom bar — original: [gear 46px] [Search pill 46px] [compose 46px], #232326 */
.sb-foot{position:relative; z-index:5; display:flex; align-items:center; gap:10px; padding:10px 14px calc(22px + env(safe-area-inset-bottom)); background:var(--bg); flex:none; transform:translateY(calc(-1 * var(--kb))); transition:transform .28s cubic-bezier(.22,1,.36,1);}
.sb-foot-btn{width:46px; height:46px; border-radius:50%; background:var(--pill); border:1px solid var(--border); color:var(--text2); display:grid; place-items:center; flex:none; cursor:pointer;}
.sb-foot-btn:active{background:var(--hover);}
.sb-search{flex:1; height:46px; border-radius:999px; background:var(--pill); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; gap:8px; padding:0 14px; color:var(--muted); min-width:0; cursor:text;}
.sb-search input{width:62px; flex:none; background:none; border:none; outline:none; color:var(--text); font-size:15px; font-weight:500; min-width:0; transition:width .2s;}
.sb-search:focus-within{justify-content:flex-start; border-color:color-mix(in srgb, var(--accent) 55%, transparent);}
.sb-search:focus-within input{flex:1; width:auto;}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;font-weight:700;flex:none;}

/* ---------- Chat header ---------- */
/* Top bar — transparent GRADIENT blur, never a solid block: darkest
   (most opaque) at the very top edge, fading lighter downward into
   fully transparent, in both themes (it is built from var(--bg)).
   The mask fades the backdrop blur itself out with the colour, so
   there is no hard edge where the bar ends. */
.topblur{position:absolute; top:0; left:0; right:0; height:calc(116px + env(safe-area-inset-top)); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); background:linear-gradient(to bottom, color-mix(in srgb, var(--bg) 94%, transparent) 0%, color-mix(in srgb, var(--bg) 78%, transparent) 26%, color-mix(in srgb, var(--bg) 46%, transparent) 55%, color-mix(in srgb, var(--bg) 16%, transparent) 82%, transparent 100%); -webkit-mask-image:linear-gradient(to bottom, #000 0%, #000 34%, transparent 100%); mask-image:linear-gradient(to bottom, #000 0%, #000 34%, transparent 100%); z-index:5; pointer-events:none;}
header.chat-head{position:relative; z-index:6; display:flex; align-items:center; gap:10px; padding:calc(10px + env(safe-area-inset-top)) 12px 8px; min-height:60px;}
.circle-btn{position:relative; width:44px; height:44px; border-radius:50%; background:var(--glass); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); border:1px solid var(--border); display:grid; place-items:center; color:var(--text); flex:none;}
.circle-btn .dot{position:absolute; top:2px; right:2px; width:9px; height:9px; border-radius:50%; background:var(--accent); border:2px solid var(--bg);}
.circle-btn.sm{width:40px; height:40px;}
/* AI reaction on a user message: one small emoji badge tucked under
   the bubble's corner — used sparingly, only when it fits. */
.msg-reaction{align-self:flex-end; margin:-9px 12px 0 0; background:var(--surface); border:1px solid var(--border2); border-radius:999px; padding:1px 7px; font-size:13px; line-height:1.55; position:relative; z-index:1; box-shadow:0 4px 12px rgba(0,0,0,.25);}
.msg-like{align-self:flex-end; margin:-9px 12px 0 0; background:var(--surface); border:1px solid var(--border2); color:var(--accent); border-radius:999px; padding:4px 6px; position:relative; z-index:1; box-shadow:0 4px 12px rgba(0,0,0,.25); display:inline-flex;}
.msg.ai .msg-like{align-self:flex-start; margin:-9px 0 0 12px;}
.head-center{flex:1; display:flex; justify-content:center; min-width:0;}
.model-pill{display:flex; align-items:center; gap:7px; background:var(--glass); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); border:1px solid var(--border); border-radius:999px; padding:9px 14px; font-size:14.5px; font-weight:600; max-width:100%;}
.model-pill .mdot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none;}
.model-pill.on .mdot{background:var(--accent);}
.model-pill span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
/* The top API pill is an alert, not a permanent control: it is hidden
   completely while a key is set and the provider is answering. It only
   appears when no API is set, the API is not working / messages are
   failing, the quota was reached, or the key/model just changed and
   has not answered yet. Changing the model lives in the + sheet's
   Model section and in Settings → APIs & Providers. */
.model-pill[hidden]{display:none !important;}
.model-pill.warn{border-color:rgba(255,69,58,.55);}
.model-pill.warn .mdot{background:var(--danger);}
.head-pill{display:flex; align-items:center; background:var(--glass); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); border:1px solid var(--border); border-radius:999px; overflow:hidden; flex:none;}
.head-pill button{width:42px; height:42px; display:grid; place-items:center; color:var(--text);}
.head-pill button:active{background:var(--hover);}
.head-pill button.temp-on{color:var(--accent);}
.head-pill .sep{width:1px; height:22px; background:var(--border2);}

/* ---------- Messages ---------- */
#chatScroll{flex:1; min-height:0; overflow-y:auto; overflow-x:hidden; overscroll-behavior:contain; overscroll-behavior-y:contain; -webkit-overflow-scrolling:touch; touch-action:pan-y; padding:8px 0 10px; position:relative; z-index:1;}
.msg-wrap{max-width:760px; margin:0 auto; padding:0 16px; display:flex; flex-direction:column; gap:14px;}
.msg{display:flex; flex-direction:column; min-width:0; max-width:100%; cursor:pointer; border-radius:18px;}
.msg.user{align-items:flex-end;}
.bubble-user{width:fit-content; max-width:90%; background:var(--surface2); color:var(--text); padding:10px 15px; border-radius:22px; font-size:15.5px; line-height:1.45; word-break:normal; overflow-wrap:break-word; white-space:pre-wrap; transition:background .18s, box-shadow .18s;}
.msg.ai .body{font-size:15.5px; line-height:1.55; color:var(--text); white-space:pre-wrap; overflow-wrap:break-word; border-radius:14px; transition:background .18s, box-shadow .18s;}
/* Tapped message lifts just enough to show which one the menu owns. */
.msg:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
.msg.menu-open .bubble-user{background:var(--surface); box-shadow:0 0 0 1px var(--border2), 0 8px 24px rgba(0,0,0,.22);}
.msg.menu-open.ai .body{background:var(--hover); box-shadow:0 0 0 6px var(--hover);}
.msg.menu-open.ai .codeblock{box-shadow:0 0 0 1px var(--border2);}
.reply-quote{max-width:90%; background:var(--rowbg); border:1px solid var(--border); color:var(--muted); border-radius:12px; padding:6px 10px; font-size:12.5px; line-height:1.35; margin-bottom:5px; overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;}
.msg.ai .reply-quote{align-self:flex-start;}
.msg.ai .body b{font-weight:650;}
.msg-actions{display:flex; gap:2px; margin-top:5px;}
.msg-actions button{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--muted);}
.msg-actions button:active{background:var(--hover); color:var(--text);}
.typing{display:inline-flex; gap:5px; padding:6px 2px;}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted); animation:tp 1.1s infinite;}
.typing i:nth-child(2){animation-delay:.18s;} .typing i:nth-child(3){animation-delay:.36s;}
@keyframes tp{0%,60%,100%{opacity:.3; transform:translateY(0);}30%{opacity:1; transform:translateY(-3px);}}
@media (prefers-reduced-motion:reduce){.typing i{animation:none;}}
.codeblock{margin:10px 0; border:1px solid var(--border); border-radius:14px; overflow:hidden; background:var(--surface); min-width:0; max-width:100%;}
.canvas-building{font-size:15.5px; margin:12px 0 2px;}
.canvas-card{display:block; width:100%; text-align:left; background:var(--surface); border:1px solid var(--border); border-radius:22px; padding:18px; margin:10px 0; color:var(--text);}
.canvas-top{display:flex; align-items:center; gap:14px;}
.canvas-open-row{display:flex; justify-content:flex-end; margin-top:14px;}
.canvas-open{background:var(--accent); color:var(--accent-ink); border:0; border-radius:999px; padding:9px 24px; font-size:15px; font-weight:600; cursor:pointer;}
.canvas-summary{margin:12px 0 4px; font-size:15.5px; line-height:1.5;}
#canvasView{position:fixed; inset:0; z-index:1150; background:var(--bg); display:flex; flex-direction:column;}
#canvasView[hidden]{display:none;}
.cv-head{display:flex; align-items:center; gap:10px; padding:calc(10px + env(safe-area-inset-top)) 14px 8px;}
.cv-iconbtn{width:42px; height:42px; flex:none; display:flex; align-items:center; justify-content:center; color:var(--text); background:transparent; border:0; cursor:pointer;}
.cv-iconbtn svg{width:24px; height:24px;}
.cv-title{flex:1; min-width:0; text-align:center; font-size:16px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.cv-menu{position:absolute; top:calc(58px + env(safe-area-inset-top)); right:12px; z-index:5; min-width:224px; background:var(--glass-strong); -webkit-backdrop-filter:blur(22px) saturate(1.4); backdrop-filter:blur(22px) saturate(1.4); border:1px solid var(--border2); border-radius:20px; padding:6px; box-shadow:0 18px 50px rgba(0,0,0,.5);}
.cv-menu button{display:flex; align-items:center; gap:10px; width:100%; text-align:left; padding:11px 12px; border:0; background:transparent; color:var(--text); font-size:15px; border-radius:13px; cursor:pointer;}
.cv-menu button:active{background:var(--hover);}
#cvFrame{flex:1; width:100%; border:0; background:transparent;}
.cv-codewrap{flex:1; display:flex; flex-direction:column; min-height:0;}
.cv-codewrap[hidden]{display:none;}
.cv-codebar{display:flex; align-items:center; gap:8px; padding:8px 14px; font-size:13px; font-weight:600; color:var(--muted);}
.cv-codebar .sp{flex:1;}
.cv-codebar button{display:flex; align-items:center; gap:5px; font-size:13px; font-weight:600; color:var(--text); padding:6px 11px; border-radius:9px; background:var(--hover); border:0; cursor:pointer;}
.cv-codebar #cvApply{color:var(--accent-ink); background:var(--accent);}
#cvCode{flex:1; width:100%; border:0; resize:none; background:var(--surface); color:var(--text); font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:13px; line-height:1.55; padding:14px 16px; outline:none;}
#cvFab{position:absolute; right:18px; bottom:calc(20px + env(safe-area-inset-bottom)); width:54px; height:54px; border-radius:50%; border:1px solid var(--border2); background:var(--glass-strong); -webkit-backdrop-filter:blur(20px) saturate(1.4); backdrop-filter:blur(20px) saturate(1.4); color:var(--text); display:flex; align-items:center; justify-content:center; cursor:pointer; box-shadow:0 12px 32px rgba(0,0,0,.45);}
#cvFab svg{width:23px; height:23px;}
#cvFab[hidden]{display:none;}
.cv-composer{position:absolute; left:12px; right:12px; bottom:calc(12px + env(safe-area-inset-bottom)); display:flex; align-items:flex-end; gap:8px; background:var(--glass-strong); -webkit-backdrop-filter:blur(20px) saturate(1.4); backdrop-filter:blur(20px) saturate(1.4); border:1px solid var(--border2); border-radius:28px; padding:6px 6px 6px 16px; box-shadow:0 16px 40px rgba(0,0,0,.45);}
.cv-composer[hidden]{display:none;}
.cv-composer textarea{flex:1; border:0; background:transparent; color:var(--text); font:inherit; font-size:16px; resize:none; outline:none; max-height:110px; padding:8px 0;}
.cv-composer .send-btn{flex:none;}
.canvas-features h4{font-size:17px; margin:14px 0 8px; font-weight:700;}
.canvas-features ul{margin:0; padding-left:20px;}
.canvas-features li{margin:5px 0; font-size:15px; line-height:1.45;}
.canvas-ico{width:40px; height:40px; flex:none; border:1.6px solid var(--text2); border-radius:11px; display:flex; align-items:center; justify-content:center; color:var(--text);}
.canvas-ico svg{width:20px; height:20px;}
.canvas-meta{display:flex; flex-direction:column; gap:3px; flex:1; min-width:0;}
.canvas-title{font-size:16.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.canvas-status{font-size:13.5px; color:var(--muted);}
.canvas-card.writing .canvas-status{animation:canvasPulse 1.15s ease-in-out infinite;}
@keyframes canvasPulse{50%{opacity:.4}}
@media (prefers-reduced-motion:reduce){.canvas-card.writing .canvas-status{animation:none}}
.codeblock-head{display:flex; align-items:center; gap:8px; padding:8px 12px; background:var(--rowbg); font-size:12.5px; color:var(--muted); font-weight:600;}
.codeblock-head .sp{flex:1;}
.codeblock-head button{display:flex; align-items:center; gap:5px; font-size:12.5px; font-weight:600; color:var(--text); padding:5px 9px; border-radius:8px; background:var(--hover);}
.codeblock pre{margin:0; padding:12px 14px; overflow-x:auto; -webkit-overflow-scrolling:touch; touch-action:pan-x pan-y; font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:13px; line-height:1.5; white-space:pre-wrap; overflow-wrap:anywhere; word-break:break-word; min-width:0; max-width:100%;}
.welcome{max-width:760px; margin:6vh auto 0; padding:0 22px; text-align:left;}
.welcome h1{font-size:27px; font-weight:700; letter-spacing:-.02em; margin:0 0 6px;}
.welcome p{color:var(--muted); margin:0 0 20px; font-size:15.5px;}
.starter-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.starter{background:var(--rowbg); border:1px solid var(--border); border-radius:16px; padding:14px; text-align:left; font-size:14.5px; font-weight:550; line-height:1.35;}
.starter small{display:block; color:var(--muted); font-weight:400; margin-top:4px; font-size:13px;}
.starter:active{background:var(--hover);}

/* ---------- Split screen — minimal, fills the whole screen ----------
   No split bar in the layout flow and no pane header bars: the two
   panes split the full available height edge to edge (the only divider
   is one hairline between them), each pane title is a tiny overlay
   label that fades into the pane on the same gradient as the top bar,
   and Swap / Exit live in one small floating glass pill on the divider
   at the right edge — nothing takes layout space away from the chats.
   The active pane is marked only by its dot and title colour: no
   outline box around a pane any more. */
#splitBar{display:none; position:absolute; right:10px; top:50%; transform:translateY(-50%); z-index:24; align-items:center; gap:2px; margin:0; padding:4px; border-radius:999px; background:var(--glass2); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); border:1px solid var(--border2); box-shadow:0 10px 30px rgba(0,0,0,.35); font-size:12.5px; font-weight:600;}
#splitBar.show{display:flex;}
#splitBar>span{display:none;}
#splitBar .sp{display:none;}
#splitBar button{display:flex; align-items:center; gap:5px; padding:6px 11px; border-radius:999px; background:transparent; font-size:12.5px; font-weight:600;}
#splitBar button:active{background:var(--hover);}
#splitWrap{display:none; flex:1; min-height:0; flex-direction:column; gap:0; margin:0; padding:0; width:100%;}
#splitWrap.show{display:flex;}
/* Split divider drag handle: a small clean pill on the divider, no
   text — press and drag to resize the panes (Samsung / Apple style). */
#splitHandle{display:none;}
#splitWrap.show #splitHandle{display:flex; height:24px; margin:-12px 0; padding:0; position:relative; z-index:6; align-items:center; justify-content:center; cursor:row-resize; touch-action:none; -webkit-tap-highlight-color:transparent;}
#splitHandle .sh-bar{width:46px; height:5px; border-radius:99px; background:var(--muted); opacity:.5; transition:opacity .15s, background .15s, width .15s;}
#splitHandle:active .sh-bar, #splitHandle.drag .sh-bar{opacity:.95; background:var(--text2); width:58px;}
.pane{flex:1 1 0; min-height:0; display:flex; flex-direction:column; position:relative; border-top:none;}
.pane + .pane{border-top:1px solid var(--border);}
.pane-head{position:absolute; top:0; left:0; right:0; z-index:3; display:flex; align-items:center; gap:7px; padding:7px 12px 16px; font-size:12px; font-weight:650; color:var(--muted); pointer-events:none; background:linear-gradient(to bottom, color-mix(in srgb, var(--bg) 85%, transparent), transparent);}
.pane.active .pane-head{color:var(--text);}
.pane-head .pdot{width:7px;height:7px;border-radius:50%;background:var(--surface2); flex:none;}
.pane.active .pane-head .pdot{background:var(--accent);}
.pane-head .ptitle{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.pane-scroll{flex:1; min-height:0; overflow-y:auto; overflow-x:hidden; overscroll-behavior:contain; overscroll-behavior-y:contain; -webkit-overflow-scrolling:touch; touch-action:pan-y; padding:30px 0 6px;}
.pane-scroll .msg-wrap{padding:0 12px; gap:10px;}
.pane.active{box-shadow:none;}
#splitWrap.show ~ #chatScroll{display:none;}

/* ---------- Composer ---------- */
/* Bottom bar — the mirror gradient blur: darkest at the very bottom
   edge, blending upward into fully transparent; the mask fades the
   blur out upward too, so no hard edge and no solid block, both themes. */
.bottomblur{position:absolute; left:0; right:0; bottom:0; height:calc(150px + env(safe-area-inset-bottom)); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); background:linear-gradient(to top, color-mix(in srgb, var(--bg) 94%, transparent) 0%, color-mix(in srgb, var(--bg) 78%, transparent) 26%, color-mix(in srgb, var(--bg) 46%, transparent) 55%, color-mix(in srgb, var(--bg) 16%, transparent) 82%, transparent 100%); -webkit-mask-image:linear-gradient(to top, #000 0%, #000 34%, transparent 100%); mask-image:linear-gradient(to top, #000 0%, #000 34%, transparent 100%); z-index:4; pointer-events:none;}
#composerZone{position:relative; z-index:6; padding:0 12px; transform:translateY(calc(-1 * var(--kb))); transition:transform .25s var(--ease);}
/* Keyboard open: the bottom nav is gone entirely (not just slid
   away), so its height no longer holds the composer up, and the
   composer's own bottom margin + safe-area inset collapse to a
   minimal 6px — the chat box sits just above the keyboard with
   only that small gap, in both layout modes (resized layout and
   overlay keyboard, where the --kb lift does the work). */
html.kb-open #bottomNav{display:none !important;}
html.kb-open .composer{margin-bottom:6px;}
html.kb-open .bottomblur{height:104px;}
html.kb-open .cv-composer{bottom:6px;}
.cv-composer{transform:translateY(calc(-1 * var(--kb)));}
#cmdBox{display:none; margin:0 2px 8px; background:var(--glass2); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); border:1px solid var(--border2); border-radius:16px; overflow:hidden; max-height:264px; overflow-y:auto; overscroll-behavior:contain; position:relative; z-index:30; pointer-events:auto; box-shadow:0 14px 40px rgba(0,0,0,.35);}
#cmdBox.show{display:block;}
.cmd-row{display:flex; align-items:center; gap:11px; width:100%; text-align:left; padding:11px 14px; font-size:15px;}
.cmd-row:active,.cmd-row.hot{background:var(--hover);}
.cmd-row .c{font-weight:650; font-family:ui-monospace,Menlo,monospace; font-size:14px;}
.cmd-row .d{color:var(--muted); font-size:13px; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; text-align:right;}
#attachRow{display:none; gap:8px; margin:0 2px 8px; flex-wrap:wrap;}
#attachRow.show{display:flex;}
.attach-chip{display:flex; align-items:center; gap:7px; background:var(--surface2); border-radius:10px; padding:7px 10px; font-size:13px; font-weight:550; max-width:100%;}
.attach-chip span{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:180px;}
.attach-chip .athumb{width:26px; height:26px; border-radius:7px; object-fit:cover; flex:none;}
.attach-chip .asz{color:var(--muted); font-size:11.5px; font-weight:400;}
.attach-chip button{display:grid; place-items:center; color:var(--muted); flex:none;}
/* Link previews — pending cards sit in a small stack directly above
   the composer (same spot as the file chip in the reference), and the
   same card renders inside the sent message after sending. */
#linkPreviewRow{display:none; flex-direction:column; gap:8px; margin:0 2px 8px;}
#linkPreviewRow.show{display:flex;}
.lp-pending{display:flex; align-items:center; gap:11px; background:var(--glass2); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); border:1px solid var(--border2); border-radius:16px; padding:8px 10px 8px 8px; max-width:420px; box-shadow:0 10px 28px rgba(0,0,0,.25);}
.lp-pending .lp-thumb{width:52px; height:52px; border-radius:11px; object-fit:cover; flex:none; background:var(--surface2);}
.lp-pending .lp-thumb-ph{width:52px; height:52px; border-radius:11px; flex:none; background:var(--surface2); display:grid; place-items:center; color:var(--muted);}
.lp-pending .lp-meta{flex:1; min-width:0;}
.lp-pending .lp-title{font-size:13.5px; font-weight:600; line-height:1.3; overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;}
.lp-pending .lp-url{font-size:12px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; margin-top:2px;}
.lp-pending .lp-x{width:30px; height:30px; border-radius:50%; display:grid; place-items:center; color:var(--muted); flex:none;}
.lp-pending .lp-x:active{background:var(--hover); color:var(--text);}
.lp-card{display:block; width:min(320px,86vw); background:var(--surface); border:1px solid var(--border2); border-radius:16px; overflow:hidden; color:var(--text); text-decoration:none; text-align:left;}
.lp-card .lp-img{width:100%; aspect-ratio:16/9; object-fit:cover; display:block; background:var(--surface2);}
.lp-card .lp-body{padding:10px 13px 12px;}
.lp-card .lp-title{font-size:14.5px; font-weight:650; line-height:1.32; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;}
.lp-card .lp-desc{font-size:12.5px; color:var(--muted); line-height:1.4; margin-top:3px; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;}
.lp-card .lp-dom{display:flex; align-items:center; gap:6px; font-size:12px; color:var(--muted); margin-top:7px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.lp-card .lp-dom img{width:15px; height:15px; border-radius:4px; flex:none;}
.lp-card.compact{padding:10px 13px;}
.msg-media{display:flex; flex-direction:column; gap:8px; align-items:flex-end; max-width:100%;}
.msg.ai .msg-media{align-items:flex-start;}
.msg-media img.mimg{max-width:min(280px,80vw); max-height:300px; border-radius:16px; object-fit:cover; display:block; border:1px solid var(--border);}
.msg-media video.mvid{max-width:min(300px,82vw); max-height:320px; border-radius:16px; display:block; background:#000; border:1px solid var(--border);}
.msg-files{display:flex; flex-direction:column; gap:6px; align-items:flex-end; max-width:100%;}
.msg.ai .msg-files{align-items:flex-start;}
.msg-file{display:flex; align-items:center; gap:9px; background:var(--rowbg); border:1px solid var(--border); border-radius:12px; padding:8px 12px; font-size:13px; font-weight:550; max-width:min(320px,86vw); color:var(--text);}
.msg-file .fmeta{min-width:0;}
.msg-file .fname{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.msg-file .fsz{color:var(--muted); font-size:11.5px; font-weight:400;}
.composer{display:flex; align-items:flex-end; gap:8px; background:var(--glass); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); border:1px solid var(--border2); border-radius:28px; padding:6px; margin-bottom:calc(12px + env(safe-area-inset-bottom)); box-shadow:0 10px 34px rgba(0,0,0,.28);}
.plus-btn{width:40px; height:40px; border-radius:50%; background:var(--rowbg); display:grid; place-items:center; flex:none; color:var(--text);}
.plus-btn:active{background:var(--hover);}
#chatInput{flex:1; border:none; outline:none; background:none; resize:none; color:var(--text); font-size:16px; line-height:1.4; padding:9px 2px; max-height:120px; min-width:0;}
#chatInput::placeholder{color:var(--muted);}
.send-btn{width:40px; height:40px; border-radius:50%; background:var(--accent); color:var(--accent-ink); display:grid; place-items:center; flex:none;}
.send-btn:disabled{background:var(--surface2); color:var(--muted);}
.send-btn:active{filter:brightness(1.12);}
#targetLine{display:none; font-size:11.5px; color:var(--muted); padding:0 8px 4px;}
#targetLine.show{display:block;} #targetLine b{color:var(--accent); font-weight:650;}

/* ---------- Menus, sheets, dialogs ---------- */
.menu-pop{position:fixed; z-index:1300; min-width:228px; background:var(--glass2); backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px); border:1px solid var(--border2); border-radius:16px; padding:6px; box-shadow:0 18px 50px rgba(0,0,0,.4); display:none;}
.menu-pop.show{display:block;}
.menu-pop button{display:flex; align-items:center; gap:11px; width:100%; text-align:left; padding:10px 11px; border-radius:11px; font-size:15px; font-weight:520;}
.menu-pop button:active{background:var(--hover);}
.menu-pop button.danger{color:var(--danger);}
.menu-pop .msep{height:1px; background:var(--border); margin:5px 8px;}
.menu-pop .mdot2{margin-left:auto; width:8px; height:8px; border-radius:50%; background:var(--accent);}
/* Message menu — minimal Apple-like liquid glass: one small floating
   glass card, short rows only, nothing else on screen changes. */
.msg-menu{position:fixed; z-index:1350; width:224px; min-width:224px; padding:5px; border-radius:20px; background:var(--glass2); backdrop-filter:blur(30px) saturate(180%); -webkit-backdrop-filter:blur(30px) saturate(180%); border:1px solid var(--border2); box-shadow:0 20px 55px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.08); transform-origin:top right;}
.msg-menu.show{display:block; animation:msgMenuIn .18s var(--ease);}
@keyframes msgMenuIn{from{opacity:0; transform:scale(.94) translateY(-4px);}to{opacity:1; transform:scale(1) translateY(0);}}
@media (prefers-reduced-motion:reduce){.msg-menu.show{animation:none;}}
.msg-menu button{display:flex; align-items:center; gap:11px; width:100%; min-height:44px; text-align:left; padding:10px 12px; border-radius:14px; font-size:15px; font-weight:500; color:var(--text);}
.msg-menu button .ic{width:18px; height:18px; color:var(--muted);}
.msg-menu button:active{background:var(--hover);}
.msg-menu button.danger{color:var(--danger);}
.msg-menu button.danger .ic{color:var(--danger);}
.msg-menu .msep{height:1px; background:var(--border); margin:4px 10px;}
/* Reply bar — sits directly above the composer while a reply is armed. */
#replyBar{display:none; align-items:center; gap:9px; margin:0 2px 8px; padding:9px 8px 9px 13px; background:var(--glass2); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); border:1px solid var(--border2); border-radius:16px; font-size:13.5px; box-shadow:0 10px 30px rgba(0,0,0,.25);}
#replyBar.show{display:flex;}
#replyBar .rb-label{color:var(--accent); font-weight:650; flex:none;}
#replyBar .rb-text{flex:1; min-width:0; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
#replyBar button{width:30px; height:30px; border-radius:50%; display:grid; place-items:center; color:var(--muted); flex:none;}
#replyBar button:active{background:var(--hover); color:var(--text);}
/* ---------- Full-screen Search (exactly as the reference) ----------
   Clean black page: big "Search" title top-left, a centred grey
   magnifier + "Search messages" empty state, result rows with the
   matched words bold white over grey text and a "Today · Chat name"
   meta line, and the same bottom bar as the side menu — gear circle,
   wide Search pill, and an X circle that exits back to where you
   were. No cards, no extra chrome. */
#searchView{position:fixed; inset:0; z-index:1100; background:var(--bg); color:var(--text); display:none; flex-direction:column;}
#searchView.show{display:flex;}
.search-title{font-size:30px; font-weight:700; letter-spacing:-.02em; padding:calc(16px + env(safe-area-inset-top)) 22px 6px; flex:none;}
.search-results{flex:1; min-height:0; overflow-y:auto; overflow-x:hidden; overscroll-behavior:contain; -webkit-overflow-scrolling:touch; touch-action:pan-y; padding:2px 22px 12px; display:flex; flex-direction:column;}
.search-empty{margin:auto; display:flex; flex-direction:column; align-items:center; gap:15px; color:var(--muted); text-align:center; padding:30px 10px;}
.search-empty .ic{width:58px; height:58px; stroke-width:1.5; color:#8e8e93;}
.search-empty span{font-size:16.5px;}
.sr-row{display:block; width:100%; text-align:left; padding:14px 0; border-bottom:1px solid var(--border); flex:none;}
.sr-row:active{background:var(--hover);}
.sr-snip{font-size:16.5px; line-height:1.45; color:var(--muted); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; overflow-wrap:break-word; white-space:pre-wrap;}
.sr-snip b{color:var(--text); font-weight:700;}
.sr-meta{margin-top:7px; font-size:15px; color:var(--text);}
.search-foot{display:flex; align-items:center; gap:10px; padding:10px 14px calc(16px + env(safe-area-inset-bottom)); flex:none; background:var(--bg);}
.search-foot-btn{width:52px; height:52px; border-radius:50%; background:var(--pill); border:1px solid var(--border); color:var(--text2); display:grid; place-items:center; flex:none; cursor:pointer;}
.search-foot-btn:active{background:var(--hover);}
.search-pill{flex:1; height:52px; border-radius:999px; background:var(--pill); border:1px solid var(--border); display:flex; align-items:center; gap:9px; padding:0 7px 0 17px; color:var(--muted); min-width:0;}
.search-pill input{flex:1; background:none; border:none; outline:none; color:var(--text); font-size:16.5px; min-width:0; padding:0;}
.search-clear{width:27px; height:27px; border-radius:50%; border:1.5px solid var(--muted); display:none; place-items:center; color:var(--muted); flex:none; padding:0;}
.search-clear .ic{width:13px; height:13px;}
.search-clear.show{display:grid;}
/* The message a search result jumped to pulses once so the eye lands. */
.msg.jump-flash .bubble-user,.msg.jump-flash.ai .body,.msg.jump-flash .codeblock{animation:jumpPulse 1.6s ease;}
@keyframes jumpPulse{0%,100%{box-shadow:none;}25%,60%{box-shadow:0 0 0 2px var(--accent);}}
@media (prefers-reduced-motion:reduce){.msg.jump-flash .bubble-user,.msg.jump-flash.ai .body,.msg.jump-flash .codeblock{animation:none;}}
.sheet-scrim{position:fixed; inset:0; background:var(--overlay); z-index:1200; opacity:0; pointer-events:none; transition:opacity .3s var(--ease);}
.sheet-scrim.show{opacity:1; pointer-events:auto;}
.sheet{position:fixed; left:0; right:0; bottom:var(--kbFixed,0px); z-index:1210; background:var(--surface); border-radius:24px 24px 0 0; border-top:1px solid var(--border2); padding:10px 18px calc(18px + env(safe-area-inset-bottom)); transform:translateY(105%); visibility:hidden; transition:transform .38s var(--ease), bottom .25s var(--ease), visibility 0s linear .38s; max-height:86dvh; overflow-y:auto; overflow-x:hidden; overscroll-behavior:contain; -webkit-overflow-scrolling:touch; touch-action:pan-y;}
.sheet.show{transform:translateY(0); visibility:visible; transition:transform .38s var(--ease), bottom .25s var(--ease), visibility 0s;}
@media (min-width:700px){.sheet{left:50%; right:auto; width:520px; margin-left:-260px; border-radius:24px; bottom:calc(18px + var(--kbFixed,0px)); border:1px solid var(--border2);}}
.sheet .grab{width:38px; height:5px; border-radius:3px; background:var(--surface2); margin:2px auto 14px;}
.sheet h3{margin:0 0 4px; font-size:19px; font-weight:700; letter-spacing:-.01em;}
/* Sub-menu back header inside a sheet: tapping it returns to the
   sheet's full list (see the + sheet navigation). */
.sheet-back{display:flex; align-items:center; gap:7px; font-size:17px; font-weight:700; letter-spacing:-.01em; color:var(--text); padding:2px 0 12px; margin-left:-4px;}
.sheet-back:active{color:var(--muted);}
.sheet-row .chev{margin-left:auto; color:var(--muted); display:grid; place-items:center;}
.sheet-row .val + .chev{margin-left:0;}
.sheet .sub{color:var(--muted); font-size:14px; margin:0 0 14px; line-height:1.45;}
.sheet ul{margin:0 0 6px; padding-left:19px; color:var(--text2); font-size:14.5px; line-height:1.6;}
.sheet-row{display:flex; align-items:center; gap:12px; width:100%; text-align:left; padding:13px 4px; border-bottom:1px solid var(--border); font-size:15.5px; font-weight:550;}
.sheet-row:last-child{border-bottom:none;}
.sheet-row .val{margin-left:auto; color:var(--muted); font-size:14px; font-weight:400;}
.sheet-row.danger{color:var(--danger);}
.qbtn{width:22px; height:22px; border-radius:50%; border:1.5px solid var(--muted); color:var(--muted); display:inline-grid; place-items:center; font-size:13px; font-weight:700; flex:none; line-height:1; cursor:pointer;}
.btn-primary{display:block; width:100%; background:var(--accent); color:var(--accent-ink); font-weight:650; padding:13px; border-radius:14px; font-size:15.5px; margin-top:12px;}
.btn-ghost{display:block; width:100%; background:var(--rowbg); color:var(--text); font-weight:600; padding:13px; border-radius:14px; font-size:15.5px; margin-top:9px;}
.btn-danger{display:block; width:100%; background:var(--danger); color:#fff; font-weight:650; padding:13px; border-radius:14px; font-size:15.5px; margin-top:12px;}
.field{margin-bottom:12px;}
.field label{display:block; font-size:13px; font-weight:600; color:var(--muted); margin-bottom:6px;}
.field input,.field select,.field textarea{width:100%; background:var(--input); border:1px solid var(--border); border-radius:12px; padding:11px 13px; outline:none; color:var(--text); font-size:15px;}
.field select option{background:var(--surface); color:var(--text);}
.switch{margin-left:auto; width:50px; height:30px; border-radius:999px; background:var(--surface2); position:relative; flex:none; transition:background .2s;}
.switch::after{content:""; position:absolute; top:2px; left:2px; width:26px; height:26px; border-radius:50%; background:#fff; transition:left .2s; box-shadow:0 1px 4px rgba(0,0,0,.3);}
.switch[aria-checked="true"]{background:var(--accent); box-shadow:inset 0 0 0 1px var(--border2);}
.switch[aria-checked="true"]::after{left:22px; background:var(--accent-ink);}
#toast{position:fixed; left:50%; bottom:calc(110px + env(safe-area-inset-bottom)); transform:translate(-50%,16px); background:var(--glass2); backdrop-filter:blur(20px); border:1px solid var(--border2); color:var(--text); padding:10px 16px; border-radius:999px; font-size:14px; font-weight:550; z-index:1400; opacity:0; pointer-events:none; transition:all .3s var(--ease); max-width:88vw; text-align:center;}
#toast.show{opacity:1; transform:translate(-50%,0);}

/* ---------- Settings ---------- */
#settingsView{display:none; flex:1; min-height:0; flex-direction:column; position:relative; z-index:2; background:var(--bg);}
#settingsView.show{display:flex;}
.set-head{display:flex; align-items:center; gap:10px; padding:calc(10px + env(safe-area-inset-top)) 12px 10px;}
.set-head h2{flex:1; text-align:center; font-size:18px; font-weight:700; margin:0; letter-spacing:-.01em;}
.set-scroll{flex:1; min-height:0; overflow-y:auto; overflow-x:hidden; overscroll-behavior:contain; overscroll-behavior-y:contain; -webkit-overflow-scrolling:touch; touch-action:pan-y; padding:4px 14px calc(24px + env(safe-area-inset-bottom));}
.set-inner{max-width:680px; margin:0 auto;}
.profile-card{display:flex; align-items:center; gap:13px; background:var(--rowbg); border:1px solid var(--border); border-radius:18px; padding:15px; margin-bottom:16px; width:100%; text-align:left;}
.profile-card .avatar{width:48px;height:48px;font-size:19px;}
.profile-card b{font-size:17.5px; display:block;}
.profile-card span{color:var(--muted); font-size:13.5px;}
.set-group{background:var(--rowbg); border:1px solid var(--border); border-radius:18px; overflow:hidden; margin-bottom:16px;}
.set-row{display:flex; align-items:center; gap:12px; width:100%; text-align:left; padding:14px 15px; font-size:15.5px; font-weight:550; border-bottom:1px solid var(--border);}
.set-row:last-child{border-bottom:none;}
.set-row:active{background:var(--hover);}
.set-row .val{margin-left:auto; color:var(--muted); font-size:14px; font-weight:400; display:flex; align-items:center; gap:7px;}
.set-row .ric{color:var(--text2); display:grid; place-items:center; width:24px;}
.set-search{display:flex; align-items:center; gap:8px; background:var(--glass); backdrop-filter:blur(16px); border:1px solid var(--border); border-radius:999px; padding:11px 15px; color:var(--muted); position:sticky; bottom:10px; margin-top:2px;}
.set-search input{flex:1; background:none; border:none; outline:none; color:var(--text); font-size:15px; min-width:0;}
.set-note{color:var(--muted); font-size:13.5px; line-height:1.5; margin:2px 4px 14px;}
input[type="range"]{width:100%; accent-color:var(--accent);}
.seg{display:flex; background:var(--input); border-radius:12px; padding:3px; gap:3px;}
.seg button{flex:1; padding:9px 4px; border-radius:9px; font-size:14px; font-weight:600; color:var(--muted);}
.seg button.sel{background:var(--surface2); color:var(--text);}
.swatch-row{display:flex; gap:12px;}
.swatch{display:flex; flex-direction:column; align-items:center; gap:6px; font-size:13px; font-weight:550; color:var(--muted);}
.swatch i{width:38px; height:38px; border-radius:50%; border:2px solid transparent; display:block;}
.swatch.sel{color:var(--text);} .swatch.sel i{border-color:var(--text);}
.kv{display:flex; justify-content:space-between; padding:10px 2px; border-bottom:1px solid var(--border); font-size:14.5px;}
.kv span{color:var(--muted);} .kv b{font-weight:600;}
#previewFrame{width:100%; height:52dvh; border:1px solid var(--border); border-radius:14px; background:#fff;}
/* ---------- + sheet: everything works in-sheet, no Settings trip ---------- */
.plus-sec{margin-top:16px; border-top:1px solid var(--border); padding-top:12px;}
.plus-sec-h{display:flex; align-items:center; gap:9px; font-size:13px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--muted); margin-bottom:9px;}
.plus-sec-h .val{margin-left:auto; font-size:13px; font-weight:500; letter-spacing:0; text-transform:none;}
.plus-skills{max-height:212px; overflow-y:auto; overflow-x:hidden; overscroll-behavior:contain; -webkit-overflow-scrolling:touch; touch-action:pan-y; border:1px solid var(--border); border-radius:14px; padding:0 12px; background:var(--input);}
.plus-skills .sheet-row{padding:10px 2px; font-size:14.5px;}
.plus-proj{display:none; border:1px solid var(--border); border-radius:14px; padding:4px 12px; background:var(--input); margin:2px 0 6px;}
.plus-proj.show{display:block;}
.plus-proj .sheet-row{padding:11px 2px; font-size:14.5px;}
/* ---------- Agents files (Settings file browser & editor) ---------- */
.af-path{color:var(--muted); font-size:13px; margin:0 4px 10px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.af-row{display:flex; align-items:center; gap:13px; width:100%; text-align:left; padding:11px 15px; border-bottom:1px solid var(--border);}
.af-row:last-child{border-bottom:none;}
.af-row:active{background:var(--hover);}
.af-tile{width:40px; height:46px; border-radius:7px; background:var(--surface2); color:var(--muted); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px; flex:none; border:1px solid var(--border);}
.af-tile .ext{font-size:9px; font-weight:800; letter-spacing:.04em;}
.af-tile .ic{width:17px; height:17px;}
.af-tile.folder{background:color-mix(in srgb, var(--accent) 24%, transparent); color:var(--accent); border-color:color-mix(in srgb, var(--accent) 35%, transparent);}
.af-tile.folder .ic{width:21px; height:21px;}
.af-meta{flex:1; min-width:0;}
.af-name{display:block; font-size:15.5px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.af-sub{display:block; color:var(--muted); font-size:13px; font-weight:400; margin-top:1px;}
.af-dots{width:34px; height:40px; display:grid; place-items:center; color:var(--muted); flex:none; border-radius:8px;}
.af-dots:active{background:var(--hover); color:var(--text);}
.af-head-btn{width:38px; height:38px; border-radius:50%; background:var(--glass); border:1px solid var(--border); display:grid; place-items:center; color:var(--text); flex:none;}
#afEditor{width:100%; min-height:52dvh; background:var(--input); border:1px solid var(--border); border-radius:14px; padding:13px 14px; outline:none; color:var(--text); font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:13.5px; line-height:1.55; resize:vertical;}
.af-stats{display:flex; gap:14px; color:var(--muted); font-size:12.5px; margin:8px 2px 2px;}
.af-view{font-size:15.5px; line-height:1.62; color:var(--text); padding:2px 2px 10px; overflow-wrap:break-word;}
.af-view h1{font-size:23px; font-weight:700; letter-spacing:-.02em; margin:14px 0 8px;}
.af-view h2{font-size:18.5px; font-weight:700; margin:16px 0 6px;}
.af-view h3{font-size:16px; font-weight:700; margin:14px 0 5px;}
.af-view p{margin:0 0 10px;}
.af-view ul{margin:0 0 10px; padding-left:20px;}
.af-view li{margin-bottom:4px;}
.af-view blockquote{border-left:3px solid var(--border2); margin:0 0 12px; padding:2px 0 2px 13px; color:var(--text2); font-style:italic;}
.af-view pre{background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:11px 13px; overflow-x:auto; font-family:ui-monospace,Menlo,monospace; font-size:13px; line-height:1.5; white-space:pre-wrap; overflow-wrap:anywhere;}
.af-view code{font-family:ui-monospace,Menlo,monospace; font-size:.92em; background:var(--rowbg); padding:1px 5px; border-radius:6px;}
.af-view pre code{background:none; padding:0;}
.af-view img.mdimg{max-width:100%; border-radius:14px; border:1px solid var(--border);}
.af-title{flex:1; min-width:0; font-size:17px; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.af-sortrow{display:flex; align-items:center; justify-content:space-between; padding:2px 4px 8px;}
.af-auto{display:flex; align-items:center; gap:12px; padding:2px 4px 12px;}
/* Library (opened from the Agent page MEMORY card) */
.lib-tabs{display:flex; background:var(--raised); border:1px solid var(--border); border-radius:999px; padding:4px; gap:4px; margin:2px 0 14px;}
.lib-tab{flex:1; padding:9px 0; border-radius:999px; font-size:15.5px; font-weight:600; color:var(--muted); text-align:center;}
.lib-tab.sel{background:var(--input); color:var(--text); box-shadow:inset 0 1px 0 rgba(255,255,255,.08), 0 2px 8px rgba(0,0,0,.25);}
.lib-row{display:flex; align-items:center; gap:13px; padding:11px 6px; border-radius:14px; width:100%; text-align:left;}
.lib-row:active{background:var(--raised);}
.lib-ico{width:44px; height:44px; flex:none; border-radius:12px; display:flex; align-items:center; justify-content:center; position:relative; overflow:hidden;}
.lib-ico svg{width:24px; height:24px;}
.lib-ico.doc{background:var(--raised); border:1px solid var(--border); color:var(--muted);}
.lib-ico.doc .ext{position:absolute; bottom:4px; left:0; right:0; text-align:center; font-size:7.5px; font-weight:800; letter-spacing:.04em; color:var(--muted);}
.lib-ico.art{background:color-mix(in srgb, var(--accent) 16%, transparent); color:var(--accent);}
.lib-ico img{width:100%; height:100%; object-fit:cover;}
.lib-meta{flex:1; min-width:0;}
.lib-name{font-size:16.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.lib-type{color:var(--muted); font-size:14px; margin-top:1px;}
.lib-dots{flex:none; width:34px; height:40px; display:flex; align-items:center; justify-content:center; color:var(--muted); border-radius:10px;}
.lib-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.lib-cell{background:var(--glass); border:1px solid var(--border); border-radius:18px; padding:16px 12px; display:flex; flex-direction:column; align-items:center; gap:8px; text-align:center; backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);}
.lib-cell .lib-ico{width:54px; height:54px; border-radius:14px;}
.lib-cell .lib-name{font-size:14.5px; max-width:100%;}
.lib-cell .lib-type{font-size:12.5px; margin:0;}
.lib-menu{position:absolute; top:calc(100% + 8px); right:0; width:min(320px,86vw); background:var(--glass-strong); border:1px solid var(--border); border-radius:22px; padding:8px; box-shadow:0 24px 60px rgba(0,0,0,.5); backdrop-filter:blur(22px) saturate(1.4); -webkit-backdrop-filter:blur(22px) saturate(1.4); z-index:60;}
.lib-menu .lm-row{display:flex; align-items:center; gap:14px; width:100%; padding:12px 12px; border-radius:14px; font-size:16.5px; text-align:left;}
.lib-menu .lm-row:active{background:var(--raised);}
.lib-menu .lm-ico{width:26px; display:flex; align-items:center; justify-content:center; color:var(--text); flex:none;}
.lib-menu .lm-ico svg{width:21px; height:21px;}
.lib-menu .lm-check{margin-left:auto; color:var(--text); display:flex;}
.lib-menu .lm-check svg{width:20px; height:20px;}
.lib-menu .lm-sep{height:1px; background:var(--border); margin:5px 12px;}
/* Bottom navigation — Chat, Goals, Library only */
#bottomNav{flex:none; display:flex; justify-content:space-around; padding:6px 12px calc(7px + env(safe-area-inset-bottom)); background:linear-gradient(to top, rgba(0,0,0,.6), rgba(0,0,0,0)); position:relative; z-index:5;}
[data-theme="white"] #bottomNav{background:linear-gradient(to top, rgba(255,255,255,.75), rgba(255,255,255,0));}
.bnav-btn{flex:1; display:flex; flex-direction:column; align-items:center; gap:2px; padding:5px 0 1px; color:var(--muted); font-size:11px; font-weight:600; position:relative; border-radius:14px;}
.bnav-btn svg{width:25px; height:25px;}
.bnav-btn.on{color:var(--text);}
.bnav-dot{position:absolute; top:1px; right:calc(50% - 21px); width:9px; height:9px; border-radius:50%; background:var(--accent); border:2px solid var(--bg); display:none;}
#bottomNav{max-height:96px; transition:max-height .32s cubic-bezier(.22,1,.36,1), opacity .25s ease, padding .32s cubic-bezier(.22,1,.36,1), transform .32s cubic-bezier(.22,1,.36,1);}
#bottomNav.nav-hidden{max-height:0; opacity:0; padding-top:0; padding-bottom:0; overflow:hidden; transform:translateY(10px); pointer-events:none;}
.mic-btn{width:40px; height:40px; border-radius:50%; display:grid; place-items:center; color:var(--text2); flex:none; padding:0;}
.mic-btn svg{width:21px; height:21px;}
.mic-btn.rec{color:var(--danger);}
/* Goals page */
.goals-title{font-size:30px; font-weight:800; margin:4px 0 2px;}
.goal-sec{display:flex; align-items:center; gap:9px; margin:22px 0 4px;}
.goal-sec .dot{width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center; background:color-mix(in srgb, var(--accent) 18%, transparent); flex:none;}
.goal-sec .dot i{width:8px; height:8px; border-radius:50%; background:var(--accent); display:block;}
.goal-sec .lbl{font-size:17px; font-weight:700; color:var(--accent);}
.goal-sec .add{margin-left:auto; width:36px; height:36px; display:flex; align-items:center; justify-content:center; color:var(--muted); border-radius:10px;}
.goal-sec .add svg{width:22px; height:22px;}
.goal-row{display:flex; gap:12px; padding:12px 2px; align-items:flex-start;}
.goal-check{width:25px; height:25px; flex:none; border:2px solid var(--muted); border-radius:8px; margin-top:2px; display:flex; align-items:center; justify-content:center; color:var(--accent-ink); padding:0;}
.goal-check svg{width:15px; height:15px; opacity:0;}
.goal-check.done{background:var(--accent); border-color:var(--accent);}
.goal-check.done svg{opacity:1;}
.goal-chev{width:25px; height:25px; flex:none; margin-top:2px; display:flex; align-items:center; justify-content:center; color:var(--muted); padding:0;}
.goal-chev svg{width:18px; height:18px; transition:transform .2s;}
.goal-row.open .goal-chev svg{transform:rotate(90deg);}
.goal-main{flex:1; min-width:0;}
.goal-name{font-size:16.5px; font-weight:600; line-height:1.3;}
.goal-row.done .goal-name{color:var(--muted); text-decoration:line-through;}
.goal-desc{color:var(--muted); font-size:14.5px; line-height:1.45; margin-top:3px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
.goal-row.open .goal-desc{-webkit-line-clamp:unset;}
.goal-dots{flex:none; width:32px; height:36px; display:flex; align-items:center; justify-content:center; color:var(--muted); padding:0;}
.goal-more{display:flex; align-items:center; gap:12px; color:var(--muted); padding:10px 2px; font-size:15.5px; width:100%; text-align:left;}
.cat-row{display:flex; align-items:center; gap:14px; width:100%; padding:13px 2px; font-size:17px; text-align:left;}
.cat-row .ci{width:30px; display:flex; align-items:center; justify-content:center; color:var(--muted); flex:none;}
.cat-row .ci svg{width:24px; height:24px;}
.cat-row .cp{margin-left:auto; color:var(--muted); display:flex;}
.cat-row .cp svg{width:20px; height:20px;}
.mini-row{display:flex; gap:12px; padding:11px 2px; align-items:flex-start;}
.mini-ico{width:38px; height:38px; border-radius:12px; background:var(--raised); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; color:var(--muted); flex:none;}
.mini-ico svg{width:20px; height:20px;}
.af-sortrow b{font-size:15px;}
.af-sortbtn{display:flex; align-items:center; gap:6px; color:var(--muted); font-size:13px; font-weight:600; padding:5px 8px; border-radius:8px;}
.af-sortbtn:active{background:var(--hover);}
/* ---------- Agent page (Settings) — same UI as the reference ----------
   Centred avatar with a pencil badge, name, live status line, and a
   dark pill tab bar: list, shield, clock, fingerprint. (The reference
   also has a monitor/computer tab — deliberately not included.) */
.ag-top{display:flex; align-items:flex-start; justify-content:space-between; padding:2px 0 0;}
.ag-avatar-wrap{position:relative; width:104px; height:104px; margin:0 auto;}
.ag-avatar{width:104px; height:104px; border-radius:50%; background:var(--surface2); border:1px solid var(--border2); display:grid; place-items:center; font-size:37px; font-weight:700; color:var(--text); overflow:hidden; cursor:pointer; padding:0;}
/* Animated agent avatars (original Axo presets) + chat agent head */
.agent-ava-slot{display:block; width:100%; height:100%;}
.agent-ava-slot svg{width:100%; height:100%; display:block;}
.agent-ava-slot img{width:100%; height:100%; object-fit:cover; display:block;}
.ag-avatar .agent-ava-slot{width:100%; height:100%;}
.av-svg .av-eyes{transform-box:fill-box; transform-origin:center; animation:avBlink 4.4s infinite;}
@keyframes avBlink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(0.08)}}
.av-svg.emo-typing{animation:avBob 1s ease-in-out infinite;}
.av-svg.emo-dancing{animation:avDance .62s ease-in-out infinite;}
.av-svg.emo-sleeping{animation:avSleep 3.4s ease-in-out infinite;}
.av-svg.emo-sad{animation:avSleep 4.6s ease-in-out infinite;}
.av-svg.emo-angry{animation:avShake .3s ease-in-out infinite;}
@keyframes avBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2%)}}
@keyframes avDance{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-7%) rotate(4deg)}}
@keyframes avSleep{0%,100%{transform:translateY(0)}50%{transform:translateY(2.5%)}}
@keyframes avShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-1.6%)}75%{transform:translateX(1.6%)}}
.av-z{animation:avZ 2.4s ease-in infinite;}
.av-z2{animation:avZ 2.4s .8s ease-in infinite;}
@keyframes avZ{0%{opacity:0; transform:translateY(4px)}30%{opacity:1}100%{opacity:0; transform:translateY(-6px)}}
.av-dots circle{transform-box:fill-box; transform-origin:center; animation:avDotBounce 1.1s ease-in-out infinite;}
.av-dots circle:nth-child(2){animation-delay:.15s;}
.av-dots circle:nth-child(3){animation-delay:.3s;}
@keyframes avDotBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-16%)}}
/* The agent avatar is ALWAYS moving — never a static picture. The
   whole avatar floats and breathes continuously (wrapper), the SVG
   itself sways gently even in "idle" (emote classes keep their own
   faster motion), and an uploaded photo sways inside its circle too. */
.av-svg{animation:avAlive 3.8s ease-in-out infinite; will-change:transform;}
@keyframes avAlive{0%,100%{transform:translateY(0) rotate(-1deg) scale(1);}50%{transform:translateY(-2.2%) rotate(1deg) scale(1.015);}}
.ca-ava{border-radius:50%; overflow:hidden; background:var(--surface2); flex:none; animation:caFloat 3.4s ease-in-out infinite; will-change:transform;}
@keyframes caFloat{0%,100%{transform:translateY(0) scale(1);}50%{transform:translateY(-5px) scale(1.02);}}
.agent-ava-slot img{animation:caSway 4.4s ease-in-out infinite; will-change:transform;}
@keyframes caSway{0%,100%{transform:scale(1.06) rotate(-1deg);}50%{transform:scale(1.1) rotate(1deg) translateY(-1.5%);}}
.ag-avatar{animation:caFloat 3.8s ease-in-out infinite; will-change:transform;}
@media (prefers-reduced-motion:reduce){.av-svg, .av-svg *, .ca-ava, .ag-avatar, .agent-ava-slot img, .avedit-preview{animation:none !important;}}
.chat-agent-head{display:flex; flex-direction:column; align-items:center; padding:30px 0 10px;}
/* ---------- Change Avatar editor (like the reference) ----------
   Large live preview at the top centre, a colour ring picker under
   it, a 5-wide grid of face expressions, a divider, then a 5-wide
   grid of shapes. Back circle top-left, blue save-check top-right. */
.avedit-head{display:flex; align-items:center; gap:10px; padding:calc(10px + env(safe-area-inset-top)) 12px 10px;}
.avedit-head h2{flex:1; text-align:center; font-size:18px; font-weight:600; margin:0;}
.avedit-save{width:44px; height:44px; border-radius:50%; background:#5b9dff; color:#fff; display:grid; place-items:center; flex:none; box-shadow:0 6px 18px rgba(91,157,255,.35);}
.avedit-save svg{width:22px; height:22px;}
.avedit-preview{display:flex; justify-content:center; padding:18px 0 6px; animation:caFloat 3.4s ease-in-out infinite; will-change:transform;}
.avedit-preview svg{width:168px; height:168px; display:block;}
.avedit-ringrow{display:flex; justify-content:center; padding:12px 0 4px;}
.avedit-ring{width:52px; height:52px; border-radius:50%; padding:4px; background:conic-gradient(#f55,#ff9f0a,#ffd60a,#32d74b,#64d2ff,#5e5ce6,#bf5af2,#f55); cursor:pointer; flex:none;}
.avedit-ring i{display:block; width:100%; height:100%; border-radius:50%; border:3px solid var(--bg);}
.avedit-pal{display:flex; justify-content:center; gap:9px; flex-wrap:wrap; padding:10px 18px 2px;}
.avedit-pal button{width:30px; height:30px; border-radius:50%; border:2px solid transparent; padding:0; cursor:pointer;}
.avedit-pal button.sel{border-color:var(--text); box-shadow:0 0 0 2px var(--bg), 0 0 0 3.5px var(--text);}
.avedit-grid{display:grid; grid-template-columns:repeat(5,1fr); gap:12px 8px; padding:16px 14px 4px; max-width:520px; margin:0 auto; width:100%;}
.avedit-cell{display:flex; justify-content:center;}
.avedit-face{width:56px; height:56px; border-radius:50%; background:var(--surface); border:1px solid var(--border); display:grid; place-items:center; color:#fff; cursor:pointer; padding:0;}
.avedit-face svg{width:38px; height:38px; display:block;}
.avedit-face.sel{background:var(--surface2); box-shadow:0 0 0 2px var(--text);}
.avedit-shape{width:60px; height:60px; border-radius:16px; background:transparent; display:grid; place-items:center; cursor:pointer; padding:4px;}
.avedit-shape svg{width:50px; height:50px; display:block;}
.avedit-shape.sel{background:var(--surface2); box-shadow:inset 0 0 0 1px var(--border2);}
.avedit-div{height:1px; background:var(--border); margin:18px 14px 2px;}
.ca-name{margin-top:-13px; background:var(--surface2); border:1px solid var(--border2); padding:4px 15px; border-radius:999px; font-weight:600; font-size:14.5px; position:relative; z-index:1;}
.av-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(98px,1fr)); gap:10px;}
.av-card{background:var(--surface); border:1px solid var(--border); border-radius:18px; padding:12px 8px; display:flex; flex-direction:column; align-items:center; gap:8px; color:var(--text); font-size:13px; cursor:pointer;}
.av-card.sel{border-color:var(--accent); box-shadow:0 0 0 1px var(--accent);}
.av-prev{width:64px; height:64px; display:block;}
.av-prev svg{width:100%; height:100%; display:block;}
.av-prev.sm{width:48px; height:48px;}
/* Swipeable avatar picker (Create agent): one big avatar at a time,
   swipe left / right (or tap the arrows / dots) to change it. */
.avp{position:relative; overflow:hidden; border-radius:22px; background:var(--surface); border:1px solid var(--border);}
.avp-track{display:flex; transition:transform .42s var(--ease); will-change:transform;}
.avp-slide{min-width:100%; box-sizing:border-box; display:flex; flex-direction:column; align-items:center; gap:9px; padding:22px 16px 6px;}
.avp-slide .av-prev{width:104px; height:104px;}
.avp-name{font-size:15.5px; font-weight:600;}
.avp-arrow{position:absolute; top:44%; transform:translateY(-50%); width:37px; height:37px; border-radius:50%; background:var(--surface2); border:1px solid var(--border2); display:grid; place-items:center; color:var(--text); cursor:pointer; z-index:2;}
.avp-arrow.l{left:10px;} .avp-arrow.r{right:10px;}
.avp-arrow .ic{width:19px; height:19px;}
.avp-dots{display:flex; gap:6px; justify-content:center; padding:10px 0 4px;}
.avp-dots button{width:7px; height:7px; border-radius:50%; background:var(--border2); padding:0; cursor:pointer; border:0;}
.avp-dots button.sel{background:var(--text);}
.avp-hint{text-align:center; color:var(--muted); font-size:12.5px; padding:0 0 12px;}
.av-emotes{display:flex; gap:6px; flex-wrap:wrap;}
.av-emote{display:flex; flex-direction:column; align-items:center; gap:5px; font-size:12px; color:var(--muted); width:64px;}
/* Appearance — preview phone, theme circles, radio lists */
.aprev{border:2px solid var(--accent); border-radius:38px; padding:22px 16px 14px; max-width:232px; margin:6px auto 4px; background:var(--bg); display:flex; flex-direction:column; align-items:center;}
.aprev-ava{width:76px; height:76px; border-radius:50%; overflow:hidden; background:var(--surface2); flex:none;}
.aprev-ava svg,.aprev-ava img{width:100%; height:100%; display:block; object-fit:cover;}
.aprev.hideava .aprev-ava,.aprev.hideava .aprev-name{display:none;}
.aprev-name{margin-top:-12px; background:var(--surface2); border:1px solid var(--border2); padding:3px 13px; border-radius:999px; font-weight:600; font-size:13.5px; position:relative; z-index:1;}
.aprev-b{height:15px; border-radius:7px; background:var(--surface2); margin-top:12px;}
.aprev-b.ai{width:88%; align-self:flex-start;}
.aprev-b.me{background:var(--accent); width:72%; align-self:flex-end;}
.aprev-b.short{height:11px;}
.aprev-bar{width:100%; height:30px; border-radius:999px; background:var(--surface); margin-top:16px;}
.ap-label{font-size:14px; color:var(--muted); font-weight:600; margin:22px 2px 8px;}
.theme-circles{display:flex; gap:12px; overflow-x:auto; padding:14px; background:var(--surface); border-radius:22px; -webkit-overflow-scrolling:touch;}
.tcircle{width:46px; height:46px; border-radius:50%; flex:none; border:0; cursor:pointer; padding:0; box-shadow:inset 0 0 0 1px var(--border2);}
.tcircle.sel{box-shadow:0 0 0 2px var(--bg), 0 0 0 4.5px var(--text);}
.tcircle.av{overflow:hidden; background:var(--surface2);}
.tcircle.av img{width:100%; height:100%; object-fit:cover; display:block;}
.tcircle.av svg{width:100%; height:100%; display:block;}
.radio-list{background:var(--surface); border-radius:22px; overflow:hidden;}
.radio-row{display:flex; align-items:center; width:100%; padding:16px 18px; background:transparent; border:0; border-bottom:1px solid var(--border); color:var(--text); font-size:16.5px; cursor:pointer; text-align:left;}
.radio-row:last-child{border-bottom:0;}
.radio{margin-left:auto; width:26px; height:26px; flex:none; border-radius:50%; border:2px solid var(--muted); display:flex; align-items:center; justify-content:center; color:var(--accent-ink);}
.radio.on{background:var(--accent); border-color:var(--accent);}
.radio svg{width:15px; height:15px;}
.ag-avatar img{width:100%; height:100%; object-fit:cover; display:block;}
.ag-pencil{position:absolute; right:-2px; bottom:2px; width:29px; height:29px; border-radius:50%; background:var(--surface2); border:1px solid var(--border2); display:grid; place-items:center; color:var(--text); cursor:pointer;}
.ag-pencil .ic{width:14px; height:14px;}
.ag-name{font-size:29px; font-weight:700; letter-spacing:-.02em; text-align:center; margin:14px 0 2px;}
.ag-status{text-align:center; color:var(--muted); font-size:16.5px; margin:0 0 20px;}
.ag-tabbar{display:flex; background:var(--surface); border:1px solid var(--border); border-radius:999px; padding:5px; gap:2px; margin-bottom:22px;}
.ag-tab{flex:1; height:47px; border-radius:999px; display:grid; place-items:center; color:var(--text2);}
.ag-tab .ic{width:23px; height:23px;}
.ag-tab.sel{background:var(--surface2); color:var(--text);}
.ag-sec{font-size:19px; font-weight:700; margin:4px 0 14px;}
.ag-sec2{font-size:19px; font-weight:700; margin:24px 0 14px;}
.ag-row{display:flex; gap:14px; width:100%; text-align:left; padding:9px 0; align-items:flex-start;}
.ag-row:active{opacity:.75;}
.ag-ic{width:47px; height:47px; border-radius:50%; background:#83839b; color:#ececf4; display:grid; place-items:center; flex:none;}
.ag-ic .ic{width:22px; height:22px;}
.ag-tile{width:52px; height:52px; border-radius:14px; background:var(--surface2); color:var(--text2); display:grid; place-items:center; flex:none;}
.ag-tile .ic{width:26px; height:26px;}
.ag-tile.light{background:#f2f2f7; color:#111;}
.ag-bell{width:47px; height:47px; border-radius:50%; background:#f2f2f7; color:#3a3a3c; display:grid; place-items:center; flex:none;}
.ag-bell .ic{width:22px; height:22px;}
.ag-row-main{flex:1; min-width:0;}
.ag-row-t{display:block; font-size:16.5px; font-weight:650; line-height:1.3;}
.ag-row-d{display:block; color:var(--muted); font-size:14.5px; line-height:1.4; margin-top:2px; overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;}
.ag-row-time{display:block; color:var(--muted); font-size:14.5px; margin-top:2px;}
.ag-row .chev{align-self:center; color:var(--muted); flex:none;}
.ag-spin{width:20px; height:20px; border-radius:50%; border:2.5px solid var(--surface2); border-top-color:var(--muted); animation:agspin 1s linear infinite; margin:13px;}
@keyframes agspin{to{transform:rotate(360deg);}}
@media (prefers-reduced-motion:reduce){.ag-spin{animation:none;}}
.ag-vibe-name{font-size:19px; font-weight:700; margin:2px 0 6px;}
.ag-vibe-muted{color:var(--muted); font-size:15.5px; line-height:1.5; margin:0 0 18px;}
.ag-vibe-label{font-size:12.5px; font-weight:700; letter-spacing:.09em; color:var(--muted); margin:0 0 8px;}
.ag-vibe-text{font-size:16.5px; line-height:1.55; margin:0 0 20px;}
.ag-editbtn{display:flex; align-items:center; justify-content:center; gap:9px; width:100%; background:var(--surface2); border-radius:16px; padding:16px; font-size:16.5px; font-weight:600; margin-bottom:22px;}
.ag-editbtn:active{background:var(--hover);}
.ag-cards{display:grid; grid-template-columns:1fr 1fr; gap:14px; padding-bottom:8px;}
.ag-card{position:relative; height:172px; border-radius:26px; padding:17px; text-align:left; color:#fff; overflow:hidden; display:block; width:100%;}
.ag-card .ct{display:block; font-size:20px; font-weight:800; letter-spacing:.01em;}
.ag-card .cs{display:block; font-size:11px; font-weight:600; letter-spacing:.14em; opacity:.85; margin-top:5px; font-family:ui-monospace,Menlo,monospace;}
.ag-card .cic{position:absolute; right:15px; bottom:13px; opacity:.95;}
.ag-card .cic .ic{width:25px; height:25px;}
.ag-card.soul{background:linear-gradient(140deg,#4a4a4f 0%,#8e8e93 52%,#5c5c61 100%);}
.ag-card.mem{background:linear-gradient(140deg,#2e2e33 0%,#6d6d72 55%,#48484d 100%);}

/* ---------- Agents hub + animation speed (multi-agent) ---------- */
:root{--agent-speed:1;}
html[data-theme="white"] .sb-logo{filter:invert(1);}
html[data-theme="white"] .lib-ico img{filter:invert(1);}
#agentHeadBar{display:none; justify-content:center; position:relative; z-index:6; flex:none; padding:2px 0 0;}
#agentHeadBar .chat-agent-head{padding:6px 0 4px;}
.ca-ava{animation-duration:calc(3.4s / var(--agent-speed));}
.ag-avatar{animation-duration:calc(3.8s / var(--agent-speed));}
.av-svg{animation-duration:calc(3.8s / var(--agent-speed));}
.agent-ava-slot img{animation-duration:calc(4.4s / var(--agent-speed));}
.avedit-preview{animation-duration:calc(3.4s / var(--agent-speed));}
.agent-flow>*{animation:agentFlowIn calc(.5s / var(--agent-speed)) var(--ease) both; animation-delay:calc(var(--i,0)*70ms / var(--agent-speed));}
@keyframes agentFlowIn{from{opacity:0; transform:translateY(14px) scale(.99);}to{opacity:1; transform:translateY(0) scale(1);}}
@media (prefers-reduced-motion:reduce){.agent-flow>*{animation:none;}}
.mini-ava{border-radius:50%; overflow:hidden; background:var(--surface2); flex:none; display:block; animation:caFloat calc(3.4s / var(--agent-speed)) ease-in-out infinite; will-change:transform;}
.mini-ava svg,.mini-ava img{width:100%; height:100%; display:block; object-fit:cover;}
.agent-list-row{display:flex; align-items:center; gap:12px; width:100%; text-align:left; padding:12px 14px; border-bottom:1px solid var(--border); color:var(--text);}
.agent-list-row:last-child{border-bottom:none;}
.agent-list-row:active{background:var(--hover);}
.badge{font-size:11px; font-weight:700; padding:3px 9px; border-radius:999px; background:var(--surface2); color:var(--text2); flex:none; letter-spacing:.02em;}
.badge.main{background:var(--accent); color:var(--accent-ink);}
.speed-track{position:relative; height:36px; border-radius:999px; background:var(--surface); border:1px solid var(--border); overflow:hidden; margin-top:12px;}
.speed-dot{position:absolute; top:50%; margin-top:-9px; left:8px; width:18px; height:18px; border-radius:50%; background:var(--accent); animation:speedMove calc(1.5s / var(--agent-speed)) ease-in-out infinite alternate; will-change:left;}
@keyframes speedMove{from{left:8px;}to{left:calc(100% - 26px);}}
@media (prefers-reduced-motion:reduce){.speed-dot{animation:none;} .mini-ava{animation:none;}}
input[type="range"].speed-range{margin:14px 0 2px;}
.sec-head-row{display:flex; align-items:center; gap:10px; margin:22px 2px 10px;}
.sec-head-row b{flex:1; font-size:17px;}
.add-round{width:34px; height:34px; border-radius:50%; background:var(--accent); color:var(--accent-ink); display:grid; place-items:center; flex:none;}
/* Change Avatar colour panel: hidden until the multi-colour ring is tapped.
   In-app panel only — the old native "Select colour" system dialog is gone. */
.avedit-palwrap{display:none; margin:14px auto 0; max-width:520px; background:var(--surface); border:1px solid var(--border2); border-radius:22px; padding:16px 16px 8px; animation:agentFlowIn .32s var(--ease) both;}
.avedit-palwrap.show{display:block;}
.avedit-palwrap .pal-title{font-size:14px; font-weight:650; margin:0 0 12px; color:var(--text);}
.avedit-hue{-webkit-appearance:none; appearance:none; width:100%; height:16px; border-radius:999px; background:linear-gradient(to right,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00); outline:none; margin:14px 0 6px;}
.avedit-hue::-webkit-slider-thumb{-webkit-appearance:none; width:26px; height:26px; border-radius:50%; background:#fff; border:3px solid var(--bg); box-shadow:0 0 0 1.5px var(--border2), 0 2px 8px rgba(0,0,0,.35); cursor:pointer;}
.avedit-hue::-moz-range-thumb{width:22px; height:22px; border-radius:50%; background:#fff; border:3px solid var(--bg); box-shadow:0 0 0 1.5px var(--border2); cursor:pointer;}
.avedit-previewback{width:196px; height:196px; border-radius:50%; background:var(--surface); border:1px solid var(--border); display:grid; place-items:center; margin:0 auto;}
.avedit-previewback svg{width:168px; height:168px; display:block;}
.emo-blinkeyes{transform-box:fill-box; transform-origin:center; animation:avBlink 4.4s infinite;}


button.ca-ava{border:0; padding:0; cursor:pointer; background:var(--surface2);}
.set-row .sub2{display:block; color:var(--muted); font-size:13px; font-weight:400; margin-top:2px; line-height:1.4;}

.hidden{display:none !important;}
</style>
